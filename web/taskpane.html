<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opslaan in SharePoint</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="config.js"></script>
  <script src="vendor/msal-browser.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/auth.js"></script>
  <link rel="stylesheet" href="assets/taskpane.css">
</head>
<body>
  <main class="wrap">
    <h1>Opslaan in SharePoint</h1>
    <p class="intro">Sla deze mail op in de klantmail-map. Alleen de mail die je nu open hebt wordt opgeslagen, en alleen als jij op de knop drukt.</p>

    <section class="card" id="mail-card" hidden>
      <dl>
        <dt>Onderwerp</dt><dd id="m-subject"></dd>
        <dt>Van</dt><dd id="m-from"></dd>
        <dt>Datum</dt><dd id="m-date"></dd>
        <dt>Bijlagen</dt><dd id="m-attachments"></dd>
      </dl>
    </section>

    <label for="customer-hint" class="label">Klant (optioneel)</label>
    <input id="customer-hint" type="text" maxlength="120" autocomplete="off"
           placeholder="Bijv. klantnaam of klantnummer">
    <p class="help">Helpt bij het automatisch indelen. Laat leeg als je het niet weet.</p>

    <button id="save" class="primary" type="button" disabled>Opslaan in SharePoint</button>
    <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <footer>
      <span id="version"></span> <span id="auth-mode"></span>
    </footer>
  </main>
  <script src="js/taskpane.js"></script>
</body>
</html>
